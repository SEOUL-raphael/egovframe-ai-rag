spring:
  config:
    import: optional:file:.env[.properties]
  http:
    client:
      connect-timeout: 5s
      read-timeout: 120s
  main:
    web-application-type: none
    banner-mode: off
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${WIKI_MODEL:replace-with-installed-model-id}
          temperature: 0.1
          num-ctx: 8192
          num-predict: 4096
    retry:
      max-attempts: 1
wiki:
  sources: examples/sources
  workspace: workspace
  action: help
logging:
  level:
    root: WARN
    org.springframework: WARN
